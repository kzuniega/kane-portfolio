# BREVO_SENDER_NAME, BREVO_SENDER_EMAIL and CONTACT_RECIPIENT_EMAIL are non-secret values: the
# sender name and address appear on every email sent and may also appear as
# regular page content, so they are excluded from secrets scanning.
#
# BREVO_API_KEY (and every other secret) is still scanned everywhere except the
# server-only build output listed in SECRETS_SCAN_OMIT_PATHS. Those folders hold
# the Next.js server bundle that runs inside the Netlify server function; they
# are never served to visitors. Source files and client assets (.next/static,
# public/, and the rest of the repo) are still scanned, so a key that leaks into
# browser JavaScript or a committed file will still fail the build.
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "CONTACT_RECIPIENT_EMAIL"
  SECRETS_SCAN_OMIT_PATHS = ".netlify/functions-internal,.next/server,.next/cache"
